info:
  name: Adicionar IP da Interface
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/ip/address/add"
  body:
    type: json
    data: |-
      {
        "address": "192.168.1.1/24",
        "interface": "bridge2"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
